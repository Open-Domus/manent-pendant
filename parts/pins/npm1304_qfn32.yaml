# nPM1304 QFN32 (QEAA) pin assignments.
# Source: Nordic product specification, "Table 1. QFN32 pin assignments", read on 2026-11-23 as
# page text, once; the reference netlist on another page gives the same numbers.
# https://docs.nordicsemi.com/r/bundle/ps_npm1304/page/product_overview.html (Pin assignments)
# Pin 33 is the exposed pad (AVSS). LSIN/LSOUT double as LDO input and output.
status: secondary
# Package table ("QFN32 dimensions in millimeters", mechanical specifications page, read as text
# on 2026-11-24): each entry is [min, nominal, max]. Nordic prints no land pattern there.
# nordic_land is the pattern in Nordic's reference layout (Altium board opened with KiCad's
# importer on 2026-11-24): lead pads are ovals [width, length] centred lead_centre from the
# middle, the centre land is square, with through vias under it.
package:
  body: [5.0, 5.0, 0.85]
  pitch: 0.5
  lead: [0.25, 0.4]
  exposed_pad: [3.5, 3.5]
  limits: {body: [4.9, 5.0, 5.1], lead_width: [0.2, 0.25, 0.3], lead_length: [0.3, 0.4, 0.45], exposed_pad: [3.4, 3.5, 3.6], lead_to_pad: 0.35}
  nordic_land: {file: 'nPM1304-QEAA Reference Layout 1_0', lead: [0.3, 0.85], lead_centre: 2.45, centre: 3.5, vias: {count: 9, pitch: 1.2, drill: 0.3}}
pins:
  1: {name: VOUT1}
  2: {name: PVSS1}
  3: {name: SW1}
  4: {name: PVDD}
  5: {name: SW2}
  6: {name: PVSS2}
  7: {name: GPIO0}
  8: {name: GPIO1}
  9: {name: GPIO2}
  10: {name: GPIO3}
  11: {name: GPIO4}
  12: {name: VDDIO}
  13: {name: SDA}
  14: {name: SCL}
  15: {name: SHPHLD}
  16: {name: VSET2}
  17: {name: VSET1}
  18: {name: NTC}
  19: {name: VBAT}
  20: {name: VSYS}
  21: {name: VBUS}
  22: {name: VBUSOUT}
  23: {name: CC1}
  24: {name: CC2}
  25: {name: LED0}
  26: {name: LED1}
  27: {name: LED2}
  28: {name: LSIN1}
  29: {name: LSOUT1}
  30: {name: LSIN2}
  31: {name: LSOUT2}
  32: {name: VOUT2}
  33: {name: AVSS}

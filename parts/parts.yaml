# Single source for part bodies and BOM fields.
# size: [length, width, height above the board], millimetres.
# status: verified   = read on a manufacturer page or datasheet
#         secondary  = distributor, press release or teardown summary
#         unverified = from memory or an estimate; check before freezing
# Entries shared with the ring and the band carry the status they have in those repositories.
parts:
  soc:
    function: BLE system-on-chip
    manufacturer: Nordic Semiconductor
    mpn: nRF54L15-QFAA
    package: QFN-48, 6 x 6 mm, 0.4 mm pitch
    size: [6.0, 6.0, 0.85]
    status: secondary        # dimension table read once as page text; see parts/pins
    url: https://docs.nordicsemi.com/r/bundle/ps_nrf54l15/page/chapters/mec_spec.html
  pmic:
    function: Charger, 1.8 V buck, load switches, ship mode
    manufacturer: Nordic Semiconductor
    mpn: nPM1304-QEAA
    package: QFN-32, 5 x 5 mm, 0.5 mm pitch
    size: [5.0, 5.0, 0.85]
    status: secondary        # dimension table read once as page text; see parts/pins
    url: https://docs.nordicsemi.com/r/bundle/ps_npm1304/page/product_overview.html
  flash:
    function: 512 Mbit 1.8 V SPI NOR flash
    manufacturer: Winbond
    mpn: W25Q512NW (ordering code to confirm)
    package: WSON-8, 8 x 6 mm
    size: [8.0, 6.0, 0.8]
    status: unverified       # part number, package and height from memory
    url: ""
  mic:
    function: PDM MEMS microphone with wake-on-sound, bottom port
    manufacturer: TDK InvenSense
    mpn: T5838
    package: LGA, bottom port
    size: [2.65, 3.5, 0.98]  # as placed: long side across the case
    status: verified
    url: https://invensense.tdk.com/products/digital/t5838/
  button:
    function: Tactile switch, pushed from the side through the rim; the card's part
    manufacturer: Panasonic
    mpn: EVQP7J01P
    package: SMD side-push, 3.5 x 2.9, straight terminals, no boss
    size: [3.5, 2.9, 1.35]
    actuator: 0.65           # the knob beyond the body
    status: verified         # catalogue ANCTB21E 2025-07, read for manent-card
    url: https://industry.panasonic.com/ac/cdn/e/control/switch/light-touch/catalog/sw_lt_eng_3529s_side.pdf
  led:
    function: Recording indicator
    manufacturer: Rohm
    mpn: SML-P11VT
    package: "0402"
    size: [1.0, 0.6, 0.2]
    status: verified
    url: https://fscdn.rohm.com/en/products/databook/datasheet/opto/led/chip_mono/sml-p11-e.pdf
  xtal32m:
    function: 32 MHz crystal
    manufacturer: Kyocera
    mpn: CX2016DB32000D0FLJCC
    package: "2016"
    size: [2.0, 1.6, 0.5]
    status: secondary        # distributor listings: 8 pF, 10 ppm, 60 ohm, -30 to 85 C; the QFN48 reference asks 8 pF, 40 ppm in all. Height not read
    url: ""
  xtal32k:
    function: 32.768 kHz crystal
    manufacturer: TXC
    mpn: 9HT11-32.768KDZC-T
    package: "2012"
    size: [2.0, 1.2, 0.6]
    status: secondary        # part from Nordic's reference list; height not checked
    url: ""
  inductor:
    function: Buck inductor, 2.2 uH
    manufacturer: TDK
    mpn: VLS201610HBX-2R2M-1
    package: "0806 (2016 metric)"
    size: [2.0, 1.6, 1.0]
    status: secondary        # distributor listings: 0.17 ohm max, 1.45 A, 1.00 max height; the part in Nordic's nPM1304 efficiency figure
    url: https://product.tdk.com/system/files/dam/technicalsupport/tvcl/pdf/inductor_smd_com_power_vls201610hbx-1_ecm.pdf
  inductor0402:
    function: 4.7 uH inductor of the SoC's converter, the ring's part
    manufacturer: TDK
    mpn: PLEA67BCA4R7M-1PT00
    package: "0402"
    size: [1.0, 0.6, 0.8]
    status: unverified       # 0402 and 1.08 ohm max from a distributor; 0.8 tall is the series height in a press article
    url: https://product.tdk.com/system/files/dam/technicalsupport/tvcl/pdf/inductor_smd_com_power_plea67b_ecm.pdf
  protector:
    function: Cell protection
    manufacturer: ABLIC
    mpn: S-82A1A
    package: DFN-6 1.4 x 1.4
    size: [1.4, 1.4, 0.5]
    status: secondary        # body verified, height not extracted
    url: https://www.ablic.com/en/doc/datasheet/battery_protection/S82A1A_E.pdf
  antenna:
    function: 2.4 GHz chip antenna, the same on all four products
    manufacturer: Yageo (also listed under Pulse Electronics)
    mpn: ANT1608LL14R2400A
    package: "1608 chip antenna"
    size: [1.6, 0.8, 0.4]
    status: secondary        # distributor listings: 2.4-2.484 GHz, 50 ohm, 0.40 max height; land pattern not read
    url: https://www.lcsc.com/product-detail/C723550.html
  contact:
    function: Spring contact from the board to a pad on the back cover
    manufacturer: to choose
    mpn: to choose
    package: SMD spring finger, about 5 mm working height
    size: [2.0, 1.5, 5.0]
    status: unverified
    url: ""
  nfet:
    function: Small N-channel MOSFET, the same in all eight places of the four products
    manufacturer: Nexperia
    mpn: PMZB290UNE2
    package: "DFN1006B-3 (SOT883B)"
    size: [1.0, 0.6, 0.4]
    status: secondary        # Nexperia's table: 20 V, 320 mohm at 4.5 V, 480 at 2.5 V, Vgs(th) 0.95 max; height and pin order not read
    url: https://www.nexperia.com/pip/PMZB290UNE2
  testpad:
    function: Test pad, bare copper
    manufacturer: none
    mpn: board pad
    package: round pad, 1 mm
    size: [1.0, 1.0, 0.05]
    status: verified
    url: ""
  celltabs:
    function: Pads the cell tabs are soldered to
    manufacturer: none
    mpn: board pads
    package: two pads
    size: [1.6, 4.4, 0.3]
    status: unverified
    url: ""
  passive0603:
    function: Bulk capacitor
    manufacturer: generic
    mpn: "0603"
    package: "0603"
    size: [1.6, 0.8, 0.8]
    status: verified
    url: ""
  passive0201:
    function: Radio and decoupling parts, bead, diode
    manufacturer: generic
    mpn: "0201"
    package: "0201"
    size: [0.6, 0.3, 0.3]
    status: verified
    url: ""
  passive0402:
    function: Resistor, capacitor, small inductor
    manufacturer: generic
    mpn: "0402"
    package: "0402"
    size: [1.0, 0.5, 0.55]
    status: verified
    url: ""

